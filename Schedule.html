    // State
    let activeDay = 1;
    let currentFilter = 'all';
    let completedItems = JSON.parse(localStorage.getItem('busan_fukuoka_completed_items') || '{}');

    // DOM Elements
    const dayTabsContainer = document.getElementById('day-tabs');
    const itineraryContainer = document.getElementById('itinerary-container');
    const completionStatsEl = document.getElementById('completion-stats');
    const resetProgressBtn = document.getElementById('reset-progress-btn');
    const mapQuickLauncher = document.getElementById('map-quick-launcher');
    const mapModal = document.getElementById('map-modal');
    const closeMapModalBtn = document.getElementById('close-map-modal');
    const quickMapLinksContainer = document.getElementById('quick-map-links');

    // Initialize App
    function init() {
      renderTabs();
      renderItinerary();
      updateCompletionStats();
      setupQuickMapModal();
      
      // Filter Event Listeners
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('active', 'bg-slate-800', 'text-slate-300', 'border-slate-700');
            b.classList.add('bg-slate-900/60', 'text-slate-400', 'border-slate-800');
          });
          btn.classList.add('active', 'bg-slate-800', 'text-slate-300', 'border-slate-700');
          btn.classList.remove('bg-slate-900/60', 'text-slate-400');
          
          currentFilter = btn.getAttribute('data-filter');
          renderItinerary();
        });
      });

      // Reset Button
      resetProgressBtn.addEventListener('click', () => {
        if (confirm('確定要重置所有已打勾完成的行程紀錄嗎？')) {
          completedItems = {};
          localStorage.setItem('busan_fukuoka_completed_items', JSON.stringify(completedItems));
          renderItinerary();
          updateCompletionStats();
        }
      });

      // Modal Handlers
      mapQuickLauncher.addEventListener('click', () => {
        mapModal.classList.remove('hidden');
        setTimeout(() => mapModal.classList.remove('opacity-0'), 10);
      });

      closeMapModalBtn.addEventListener('click', closeModal);
      mapModal.addEventListener('click', (e) => {
        if (e.target === mapModal) closeModal();
      });
    }

    function closeModal() {
      mapModal.classList.add('opacity-0');
      setTimeout(() => mapModal.classList.add('hidden'), 300);
    }

    // Render Navigation Tabs
    function renderTabs() {
      dayTabsContainer.innerHTML = '';
      itineraryData.forEach(d => {
        const isActive = d.day === activeDay;
        const btn = document.createElement('button');
        btn.className = `flex-shrink-0 px-3.5 py-2 rounded-xl text-left transition flex flex-col items-center justify-center border ${
          isActive 
            ? 'bg-gradient-to-b from-brand-600 to-brand-500 border-brand-400 text-white shadow-md shadow-brand-500/20 font-bold' 
            : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:text-slate-200'
        }`;
        btn.innerHTML = `
          <span class="text-[10px] uppercase tracking-wider ${isActive ? 'text-brand-100' : 'text-slate-500'}">Day ${d.day}</span>
          <span class="text-xs ${isActive ? 'text-white' : 'text-slate-300'} font-semibold">${d.date.slice(5)} (${d.dayOfWeek.slice(-1)})</span>
        `;
        btn.addEventListener('click', () => {
          activeDay = d.day;
          renderTabs();
          renderItinerary();
        });
        dayTabsContainer.appendChild(btn);
      });
    }

    // Render Itinerary Cards
    function renderItinerary() {
      itineraryContainer.innerHTML = '';
      const dayData = itineraryData.find(d => d.day === activeDay);

      if (!dayData) return;

      // Day Header Info
      const dayHeader = document.createElement('div');
      dayHeader.className = "glass-card p-4 rounded-2xl border border-slate-800 relative overflow-hidden";
      dayHeader.innerHTML = `
        <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-brand-500/10 rounded-full blur-xl pointer-events-none"></div>
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs text-brand-400 font-medium">DAY ${dayData.day < 10 ? '0' + dayData.day : dayData.day} ・ ${dayData.date} (${dayData.dayOfWeek})</span>
            <h2 class="text-lg font-bold text-white mt-0.5">${dayData.theme}</h2>
          </div>
        </div>
        <div class="flex flex-wrap gap-1.5 mt-3">
          ${dayData.highlights.map(h => `<span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700/60">✨ ${h}</span>`).join('')}
        </div>
      `;
      itineraryContainer.appendChild(dayHeader);

      // Timeline List
      const timelineContainer = document.createElement('div');
      timelineContainer.className = "relative pl-3 border-l-2 border-slate-800 space-y-4 my-2 ml-2 pb-16";

      // Filter logic
      const filteredItems = dayData.items.filter(item => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'pass') return item.tags && item.tags.includes('pass');
        if (currentFilter === 'food') return item.tags && item.tags.includes('food');
        if (currentFilter === 'highlight') return item.tags && item.tags.includes('highlight');
        return true;
      });

      if (filteredItems.length === 0) {
        timelineContainer.innerHTML = `
          <div class="py-8 text-center text-slate-500 text-xs">
            此篩選條件下無對應行程項目
          </div>
        `;
      } else {
        filteredItems.forEach((item, idx) => {
          const itemId = `d${dayData.day}_i${idx}`;
          const isDone = !!completedItems[itemId];

          const cardWrapper = document.createElement('div');
          cardWrapper.className = `relative pl-6 transition-all duration-300 ${isDone ? 'completed-item' : ''}`;

          // Timeline dot
          const dot = document.createElement('div');
          dot.className = `absolute -left-[19px] top-4 w-3.5 h-3.5 rounded-full border-2 transition-colors ${
            isDone ? 'bg-emerald-500 border-emerald-400' : 'bg-slate-900 border-brand-400'
          }`;
          cardWrapper.appendChild(dot);

          // Card Body
          const card = document.createElement('div');
          card.className = "glass-card p-4 rounded-xl border border-slate-800/80 shadow-sm hover:border-slate-700 transition";

          card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center space-x-2 text-brand-400 font-mono text-xs font-semibold">
                <i data-lucide="${item.icon || 'clock'}" class="w-4 h-4 text-brand-400"></i>
                <span>${item.time}</span>
              </div>
              <button class="toggle-done-btn p-1 rounded-lg text-slate-400 hover:text-emerald-400 hover:bg-slate-800 transition" data-id="${itemId}">
                <i data-lucide="${isDone ? 'check-circle' : 'circle'}" class="w-5 h-5 ${isDone ? 'text-emerald-400 fill-emerald-500/20' : ''}"></i>
              </button>
            </div>

            <h3 class="item-title font-bold text-slate-100 text-sm mt-1.5 leading-snug">
              ${item.title}
            </h3>

            <p class="text-xs text-slate-300 mt-1 leading-relaxed">
              ${item.desc}
            </p>

            ${item.link ? `
              <div class="mt-3 pt-2.5 border-t border-slate-800/80 flex items-center justify-between">
                <span class="text-[10px] text-slate-400 flex items-center gap-1">
                  <i data-lucide="navigation" class="w-3 h-3 text-slate-400"></i> 地圖導航
                </span>
                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-brand-500/10 hover:bg-brand-500/20 text-brand-300 text-xs font-medium border border-brand-500/20 transition">
                  <span>開啟導航</span>
                  <i data-lucide="external-link" class="w-3 h-3"></i>
                </a>
              </div>
            ` : ''}
          `;

          // Event Listener for completion checkbox
          const checkBtn = card.querySelector('.toggle-done-btn');
          checkBtn.addEventListener('click', () => {
            completedItems[itemId] = !completedItems[itemId];
            localStorage.setItem('busan_fukuoka_completed_items', JSON.stringify(completedItems));
            renderItinerary();
            updateCompletionStats();
          });

          cardWrapper.appendChild(card);
          timelineContainer.appendChild(cardWrapper);
        });
      }

      itineraryContainer.appendChild(timelineContainer);
      lucide.createIcons();
    }

    // Update Bottom Completion Counter
    function updateCompletionStats() {
      let total = 0;
      let completed = 0;

      itineraryData.forEach(d => {
        d.items.forEach((_, idx) => {
          total++;
          const itemId = `d${d.day}_i${idx}`;
          if (completedItems[itemId]) completed++;
        });
      });

      completionStatsEl.textContent = `${completed} / ${total} (${Math.round((completed/total)*100 || 0)}%)`;
    }

    window.addEventListener('DOMContentLoaded', () => {

      lucide.createIcons();
