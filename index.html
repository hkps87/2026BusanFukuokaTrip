    let activeDay = 1;
    let currentFilter = 'all';
    let completedItems = JSON.parse(localStorage.getItem('busan_fukuoka_completed_items') || '{}');

    const dayTabsContainer = document.getElementById('day-tabs');
    const itineraryContainer = document.getElementById('itinerary-container');
    const completionStatsEl = document.getElementById('completion-stats');
    const resetProgressBtn = document.getElementById('reset-progress-btn');
    const mapQuickLauncher = document.getElementById('map-quick-launcher');
    const mapModal = document.getElementById('map-modal');
    const closeMapModalBtn = document.getElementById('close-map-modal');
    const quickMapLinksContainer = document.getElementById('quick-map-links');



    function renderTabs() {
      dayTabsContainer.innerHTML = '';
      itineraryData.forEach(d => {
        const isActive = d.day === activeDay;
        const btn = document.createElement('button');
        btn.className = `flex-shrink-0 px-3.5 py-2 rounded-xl text-left transition flex flex-col items-center justify-center border ${isActive
          ? 'bg-gradient-to-b from-brand-600 to-brand-500 border-brand-400 text-white shadow-md shadow-brand-500/20 font-bold'
          : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:text-slate-200'
          }`;
        btn.innerHTML = `
          <span class="text-[10px] uppercase tracking-wider ${isActive ? 'text-brand-100' : 'text-slate-500'}">Day ${d.day}</span>
          <span class="text-xs ${isActive ? 'text-white' : 'text-slate-300'} font-semibold">${d.date.slice(5)} (${d.dayOfWeek.slice(-1)})</span>
        `;
        btn.addEventListener('click', () => {
          activeDay = d.day;
          renderTabs();
          renderItinerary();
        });
        dayTabsContainer.appendChild(btn);
      });
    }

    function renderItinerary() {
      itineraryContainer.innerHTML = '';
      const dayData = itineraryData.find(d => d.day === activeDay);
      if (!dayData) return;

      const dayHeader = document.createElement('div');
      dayHeader.className = "glass-card p-4 rounded-2xl border border-slate-800 relative overflow-hidden";
      dayHeader.innerHTML = `
        <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-brand-500/10 rounded-full blur-xl pointer-events-none"></div>
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs text-brand-400 font-medium">DAY ${dayData.day < 10 ? '0' + dayData.day : dayData.day} ・ ${dayData.date} (${dayData.dayOfWeek})</span>
            <h2 class="text-lg font-bold text-white mt-0.5">${dayData.theme}</h2>
          </div>
        </div>
        <div class="flex flex-wrap gap-1.5 mt-3">
          ${dayData.highlights.map(h => `<span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700/60">✨ ${h}</span>`).join('')}
        </div>
      `;
      itineraryContainer.appendChild(dayHeader);

      const timelineContainer = document.createElement('div');
      timelineContainer.className = "relative pl-3 border-l-2 border-slate-800 space-y-4 my-2 ml-2 pb-16";

      const filteredItems = dayData.items.filter(item => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'pass') return item.tags && item.tags.includes('pass');
        if (currentFilter === 'food') return item.tags && item.tags.includes('food');
        if (currentFilter === 'highlight') return item.tags && item.tags.includes('highlight');
        return true;
      });

      if (filteredItems.length === 0) {
        timelineContainer.innerHTML = `<div class="py-8 text-center text-slate-500 text-xs">此篩選條件下無對應行程項目</div>`;
      } else {
        filteredItems.forEach((item, idx) => {
          const itemId = `d${dayData.day}_i${idx}`;
          const isDone = !!completedItems[itemId];

          const cardWrapper = document.createElement('div');
          cardWrapper.className = `relative pl-6 transition-all duration-300 ${isDone ? 'completed-item' : ''}`;

          const dot = document.createElement('div');
          dot.className = `absolute -left-[19px] top-4 w-3.5 h-3.5 rounded-full border-2 transition-colors ${isDone ? 'bg-emerald-500 border-emerald-400' : 'bg-slate-900 border-brand-400'}`;
          cardWrapper.appendChild(dot);

          const card = document.createElement('div');
          card.className = "glass-card p-4 rounded-xl border border-slate-800/80 shadow-sm hover:border-slate-700 transition";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center space-x-2 text-brand-400 font-mono text-xs font-semibold">
                <i data-lucide="${item.icon || 'clock'}" class="w-4 h-4 text-brand-400"></i>
                <span>${item.time}</span>
              </div>
              <button class="toggle-done-btn p-1 rounded-lg text-slate-400 hover:text-emerald-400 hover:bg-slate-800 transition" data-id="${itemId}">
                <i data-lucide="${isDone ? 'check-circle' : 'circle'}" class="w-5 h-5 ${isDone ? 'text-emerald-400 fill-emerald-500/20' : ''}"></i>
              </button>
            </div>
            <h3 class="item-title font-bold text-slate-100 text-sm mt-1.5 leading-snug">${item.title}</h3>
            <p class="text-xs text-slate-300 mt-1 leading-relaxed">${item.desc}</p>
            ${item.link ? `
              <div class="mt-3 pt-2.5 border-t border-slate-800/80 flex items-center justify-between">
                <span class="text-[10px] text-slate-400 flex items-center gap-1"><i data-lucide="navigation" class="w-3 h-3 text-slate-400"></i> 地圖導航</span>
                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-brand-500/10 hover:bg-brand-500/20 text-brand-300 text-xs font-medium border border-brand-500/20 transition">
                  <span>開啟導航</span><i data-lucide="external-link" class="w-3 h-3"></i>
                </a>
              </div>
            ` : ''}
          `;

          const checkBtn = card.querySelector('.toggle-done-btn');
          checkBtn.addEventListener('click', () => {
            completedItems[itemId] = !completedItems[itemId];
            localStorage.setItem('busan_fukuoka_completed_items', JSON.stringify(completedItems));
            renderItinerary();
            updateCompletionStats();
          });

          cardWrapper.appendChild(card);
          timelineContainer.appendChild(cardWrapper);
        });
      }

      itineraryContainer.appendChild(timelineContainer);
      lucide.createIcons();
    }

    function updateCompletionStats() {
      let total = 0, completed = 0;
      itineraryData.forEach(d => {
        d.items.forEach((_, idx) => {
          total++;
          if (completedItems[`d${d.day}_i${idx}`]) completed++;
        });
      });
      completionStatsEl.textContent = `${completed} / ${total} (${Math.round((completed / total) * 100 || 0)}%)`;
    }

        { name: "沙上站", url: "https://map.naver.com/p/search/%EC%82%AC%EC%83%81%EC%97%AD" },

        { name: "白淺灘文化村", url: "https://map.naver.com/p/search/%ED%9D%B0%EC%97%AC%EC%9A%B8%EB%AC%B8%ED%99%94%EB%A7%88%EC%9D%84" },
        { name: "ARTE MUSEUM", url: "https://map.naver.com/p/search/ARTE%20MUSEUM%20Busan" },

        { name: "太宰府天滿宮", url: "https://www.google.com/maps/search/%E5%A4%AA%E5%AE%B0%E5%BA%9C%E5%A4%A9%E6%BB%BF%E5%AE%AE" },

        { name: "福岡城跡(舞鶴公園)", url: "https://www.google.com/maps/search/%E7%A6%8F%E5%B2%A1%E5%9F%8E%E8%B8%9F" },

        { name: "由布院溫泉", url: "https://www.google.com/maps/search/%E7%94%B1%E5%B8%83%E9%99%A2%E6%B8%A9%E6%B3%89" },
        { name: "金鱗湖", url: "https://www.google.com/maps/search/%E9%87%91%E9%BA%9F%E6%B9%96" },
        { name: "高千穗峽", url: "https://www.google.com/maps/search/%E9%AB%98%E5%8D%83%E7%A9%82%E5%B3%A1" },
        { name: "大濠公園", url: "https://www.google.com/maps/search/%E5%A4%A7%E6%B4%81%E5%85%AC%E5%9C%92" },
        { name: "福岡機場國際線", url: "https://www.google.com/maps/search/%E7%A6%8F%E5%B2%A1%E6%9C%BA%E5%9C%BA%E5%9B%BD%E9%99%85%E7%BA%BF" },
        { name: "博多站", url: "https://www.google.com/maps/search/%E5%8D%9A%E5%A4%9A%E7%AB%99" },
        { name: "天神地下街", url: "https://www.google.com/maps/search/%E5%A4%A9%E7%A5%9E%E5%9C%B0%E4%B8%8B%E8%A1%97" },
        { name: "阪急百貨", url: "https://www.google.com/maps/search/%E9%98%AA%E7%B4%80%E7%99%BE%E8%B2%A8" },
        { name: "柳橋連合市場", url: "https://maps.app.goo.gl/aYLoeHogFCcTGJ5s9" }
      ];

      quickMapLinksContainer.innerHTML = '';
      places.forEach(p => {
        const a = document.createElement('a');
        a.href = p.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.className = "flex items-center justify-between p-2.5 rounded-lg bg-slate-900 border border-slate-800 hover:border-brand-500/50 hover:bg-slate-800/80 transition";
        a.innerHTML = `<span class="truncate font-medium text-slate-200">${p.name}</span><i data-lucide="external-link" class="w-3.5 h-3.5 text-brand-400 flex-shrink-0 ml-1"></i>`;
        quickMapLinksContainer.appendChild(a);
      });
    }

    function closeMapModal() {
      mapModal.classList.add('opacity-0');
      setTimeout(() => mapModal.classList.add('hidden'), 300);
    }

    // 初始化執行與事件監聽
    function init() {
      renderTabs();
      renderItinerary();
      updateCompletionStats();
      setupQuickMapModal();

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const clickedFilter = btn.getAttribute('data-filter');

          if (currentFilter === clickedFilter && clickedFilter !== 'all') {
            currentFilter = 'all';

            document.querySelectorAll('.filter-btn').forEach(b => {
              b.classList.remove('active', 'bg-slate-800', 'text-slate-300', 'border-slate-700');
              b.classList.add('bg-slate-900/60', 'text-slate-400', 'border-slate-800');
              if (b.getAttribute('data-filter') === 'all') {
                b.classList.add('active', 'bg-slate-800', 'text-slate-300', 'border-slate-700');
                b.classList.remove('bg-slate-900/60', 'text-slate-400');
              }
            });
          } else {
            currentFilter = clickedFilter;
            document.querySelectorAll('.filter-btn').forEach(b => {
              b.classList.remove('active', 'bg-slate-800', 'text-slate-300', 'border-slate-700');
              b.classList.add('bg-slate-900/60', 'text-slate-400', 'border-slate-800');
            });
            btn.classList.add('active', 'bg-slate-800', 'text-slate-300', 'border-slate-700');
            btn.classList.remove('bg-slate-900/60', 'text-slate-400');
          }

          renderItinerary();
        });
      });

      resetProgressBtn.addEventListener('click', () => {
        if (confirm('確定要重置所有已打勾完成的行程紀錄嗎？')) {
          completedItems = {};
          localStorage.setItem('busan_fukuoka_completed_items', JSON.stringify(completedItems));
          renderItinerary();
          updateCompletionStats();
        }
      });

      mapQuickLauncher.addEventListener('click', () => {
        mapModal.classList.remove('hidden');
        setTimeout(() => mapModal.classList.remove('opacity-0'), 10);
      });

      closeMapModalBtn.addEventListener('click', closeMapModal);
      mapModal.addEventListener('click', (e) => {
        if (e.target === mapModal) closeMapModal();
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      init();
      lucide.createIcons();
    });

  </script>

        <div class="wheel-header">
          <h3>今天想吃哪國美食？</h3>
          <p>解決你的選擇困難症！</p>
        </div>
        <div class="country-selector">
          <div class="country-card-btn kr" onclick="selectCountry('kr')">
            <span class="country-flag">🇰🇷</span>
            <span class="country-name">韓國美食</span>
            <span class="country-tag">First Stop</span>
          </div>
          <div class="country-card-btn jp" onclick="selectCountry('jp')">
            <span class="country-flag">🇯🇵</span>
            <span class="country-name">日本美食</span>
            <span class="country-tag">Next Stop</span>
          </div>
        </div>
      </div>

      <!-- 轉盤舞台 -->
      <div id="wheel-view" class="wheel-stage">
        <button class="back-to-country-btn" onclick="showCountryView()">← 切換國家</button>
        <div class="wheel-header">
          <h3 id="current-country-title">🇰🇷 韓國美食轉盤</h3>
        </div>

        <div class="wheel-canvas-box">
          <div class="wheel-pointer"></div>
          <canvas id="wheelCanvas" width="540" height="540"></canvas>
        </div>

        <button id="spinBtn" class="spin-action-btn" onclick="spinWheel()">🎲 開始抽籤！</button>

        <!-- 結果區 -->
        <div id="wheelResult" class="wheel-result-box">
          <div class="result-title">🎉 今天決定吃這個：</div>
          <div id="resultFoodName" class="result-food">韓式烤肉</div>
          <a id="mapSearchBtn" class="map-search-btn" href="#" target="_blank">📍 在 Google Maps 搜尋周邊</a>
        </div>
      </div>
    </div>
  </div>

  <!--轉盤容器結束-->

  <script src="js/wheel.js"></script>

</body>

</html>
